services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wtr
      POSTGRES_USER: wtr
      POSTGRES_PASSWORD: wtr
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wtr -d wtr"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://wtr:wtr@postgres:5432/wtr
      HOST: 0.0.0.0
    ports: ["3000:3000"]
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
